<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: #f4f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .register-card {
    background: #ffffff;
    padding: 35px;
    width: 400px;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
  }

  .register-card h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #2c3e50;
  }

  .register-card input,
  .register-card select {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  .register-card button {
    width: 100%;
    padding: 12px;
    background: #2c3e50;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }

  .register-card button:hover {
    background: #1a252f;
  }
</style>
</head>

<body>

<div class="register-card">
  <h2>Register</h2>

  <input type="text" placeholder="First Name" required>
  <input type="text" placeholder="Last Name" required>
  
  <select required>
    <option value="">Select Gender</option>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
  </select>
  
  <input type="email" placeholder="Email" required>
  <input type="password" placeholder="Password" required>

  <select required>
    <option value="">Select Country</option>
    <option>India</option>
    <option>USA</option>
    <option>UK</option>
  </select>

  <select required>
    <option value="">Marital Status</option>
    <option>Single</option>
    <option>Married</option>
  </select>

  <select required>
    <option value="">Select Role</option>
    <option>HR</option>
    <option>MANAGER</option>
    <option>EMPLOYEE</option>
  </select>

  <input type="tel" placeholder="Phone Number" required>


  <button type="submit">Register</button>
  <p align="center">Already registered user? <a href="login.html">Login here</a></p>
</div>

</body>
</html>
