<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Applicant Login - Organizational Employee Directory</title>

<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f6f8fb;
    color: #2c3e50;
  }

  header {
    background-color: #2c3e50;
    padding: 30px 20px;
    text-align: center;
    color: white;
  }

  header h1 {
    margin: 0;
    font-size: 22px;
  }

  header p {
    margin-top: 6px;
    font-size: 14px;
    color: #aab8c7;
  }

  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    height: calc(100vh - 110px);
    padding: 20px;
  }

  .login-container {
    background: #fff;
    padding: 40px 35px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(44, 62, 80, 0.15);
    width: 350px;
    text-align: center;
  }

  .login-container h2 {
    margin-bottom: 25px;
    font-size: 24px;
  }

  .login-container input {
    width: 100%;
    padding: 12px 14px;
    margin: 12px 0;
    border: 1.5px solid #ced6e0;
    border-radius: 8px;
    font-size: 16px;
  }

  .login-container button {
    width: 100%;
    padding: 12px;
    background-color: #2c3e50;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 18px;
  }

  .login-container p {
    margin-top: 18px;
    font-size: 14px;
    color: #7a8a99;
  }

  .login-container a {
    color: #2c3e50;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>

<body>

<header>
  <h1>Applicant Login</h1>
  <p>Login to access your application dashboard</p>
</header>

<div class="login-wrapper">
  <div class="login-container">
    <h2>Login</h2>

    <!-- ✅ FORM ADDED -->
    <form onsubmit="handleApplicantLogin(event)">
      <input type="text" placeholder="Username" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <p>New user? <a href="Applicantregister.html">Register here</a></p>
  </div>
</div>

<!-- ✅ SCRIPT ADDED -->
<script>
  function handleApplicantLogin(event) {
    event.preventDefault(); // prevent page reload

    alert("Applicant Login Successful!");

    // Redirect to Applicant Dashboard
    window.location.href = "ApplicantDashboard.html";
  }
</script>

</body>
</html>
