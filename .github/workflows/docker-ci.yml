name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "feature/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Docker Stack
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for optimized multi-stage builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build and run the containers using Docker Compose
      - name: Build and Start Container Stack
        run: |
          docker compose up --build -d

      # Step 4: Verify services are healthy and responding
      - name: Health Check & Smoke Test
        run: |
          echo "Waiting for Tomcat and MySQL to initialize..."
          sleep 15
          
          # List active containers
          docker ps
          
          # Test if Tomcat web server responds on port 8080
          echo "Testing application endpoint..."
          curl --fail --retry 3 --retry-delay 5 http://localhost:8080/ || exit 1
          echo "Application is up and running!"

      # Step 5: Print logs if any previous step fails (for easy debugging)
      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          echo "=== Web Service Logs ==="
          docker logs hr_terminal_web
          echo "=== MySQL Database Logs ==="
          docker logs hr_mysql_db

      # Step 6: Clean up resources
      - name: Tear Down Containers
        if: always()
        run: |
          docker compose down --volumes --remove-orphans