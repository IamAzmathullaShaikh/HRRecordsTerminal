version: '3.8'

services:
  # Database Service
  db:
    image: mysql:8.0
    container_name: hr_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hr_records_db
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: hr_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Uncomment if you have a schema / tables initialization file:
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # Web Application Service
  web:
    build: .
    container_name: hr_terminal_web
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=hr_records_db
      - DB_USER=hr_user
      - DB_PASS=hr_password
    depends_on:
      - db

volumes:
  db_data: