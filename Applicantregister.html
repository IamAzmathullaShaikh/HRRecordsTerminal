<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Register - Organizational Employee Directory</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f6f8fb;
    color: #2c3e50;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }

  .register-card {
    background: #fff;
    padding: 40px 35px;
    width: 450px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(44, 62, 80, 0.15);
  }

  .register-card h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #22303c;
    font-weight: 700;
    font-size: 24px;
  }

  .register-card input,
  .register-card select {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 18px;
    border-radius: 8px;
    border: 1.5px solid #ced6e0;
    font-size: 16px;
    box-sizing: border-box;
  }

  .register-card button {
    width: 100%;
    padding: 14px;
    background-color: #2c3e50;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }

  .register-card p {
    text-align: center;
    margin-top: 20px;
  }

  .register-card a {
    color: #2c3e50;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>

<body>

<div class="register-card">
  <h2>Register</h2>

  <!-- ✅ ADDED FORM -->
  <form onsubmit="handleRegister(event)">

    <input type="text" placeholder="First Name" required />
    <input type="text" placeholder="Last Name" required />

    <select required>
      <option value="" disabled selected>Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <input type="date" required />

    <select required>
      <option value="" disabled selected>Marital Status</option>
      <option>Single</option>
      <option>Married</option>
    </select>

    <select required>
      <option value="" disabled selected>Select Country</option>
      <option>India</option>
      <option>USA</option>
      <option>UK</option>
    </select>

    <input type="tel" placeholder="Phone Number" required />
    <input type="email" placeholder="Email" required />
    <input type="password" placeholder="Password" required />

    <input type="file" accept=".pdf" required />

    <select required>
      <option value="" disabled selected>Select Job Title</option>
      <option>Software Engineer</option>
      <option>Data Analyst</option>
      <option>Project Manager</option>
      <option>HR Executive</option>
    </select>

    <input type="number" placeholder="Year of Passout" min="1950" max="2050" required />

    <button type="submit">Register</button>

  </form>

  <p>Already registered user? <a href="Applicantlogin.html">Login here</a></p>
</div>

<!-- ✅ ADDED SCRIPT -->
<script>
  function handleRegister(event) {
    event.preventDefault(); // stop page refresh

    alert("Registration Successful!");

    // redirect to login page
    window.location.href = "Applicantlogin.html";
  }
</script>

</body>
</html>
