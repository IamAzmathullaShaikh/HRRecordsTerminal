<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login - Organizational Employee Directory</title>
<style>
  /* Reset and base */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f6f8fb; /* light background */
    color: #2c3e50; /* navy text */
  }

  /* Header section */
  header {
    background-color: #2c3e50; /* navy blue */
    padding: 30px 20px;
    text-align: center;
    color: white;
  }

  header h1 {
    margin: 0;
    font-weight: 700;
    font-size: 22px;
  }

  header p {
    margin: 5px 0 0;
    font-weight: 400;
    font-size: 14px;
    color: #aab8c7; /* lighter text */
  }

  /* Center login container below header */
  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    height: calc(100vh - 110px); /* full height minus header  (login-container a {}css means login-container class me ka a tag ku css) */
    padding: 20px;
  }

  .login-container {
    background: #fff;
    padding: 40px 35px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(44, 62, 80, 0.15);
    width: 350px;
    text-align: center;
  }

  .login-container h2 {
    margin-bottom: 25px;
    font-weight: 700;
    font-size: 24px;
    color: #22303c;
  }

  .login-container input[type="text"],
  .login-container input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    margin: 12px 0;
    border: 1.5px solid #ced6e0;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s ease;
  }
  .login-container input[type="text"]:focus,
  .login-container input[type="password"]:focus {
    outline: none;
    border-color: #2c3e50;
    box-shadow: 0 0 6px rgba(44, 62, 80, 0.3);
  }

  .login-container button {
    width: 100%;
    padding: 12px;
    background-color: #2c3e50;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 18px;
    cursor: pointer;
    margin-top: 18px;
    transition: background-color 0.3s ease;
  }

  .login-container button:hover {
    background-color: #1a252f;
  }

  .login-container p {
    margin-top: 18px;
    font-size: 14px;
    color: #7a8a99;
  }

  .login-container a {
    color: #2c3e50;
    font-weight: 600;
    text-decoration: none;
  }

  .login-container a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<header>
  <h1></h1>
  <p></p>
</header>

<div class="login-wrapper">
  <div class="login-container">
    <h2>Login</h2>
    <input type="text" placeholder="Username" required />
    <input type="password" placeholder="Password" required />
    <button>Login</button>
    <p>New user? <a href="register.html">Register here</a></p>	
  </div>
</div>

</body>
</html>
